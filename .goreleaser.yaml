# Maxim - Terminal Database Client
# GoReleaser configuration for building and releasing

version: 2

project_name: maxim

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - 386
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    binary: maxim

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - config.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ASHUTOSH-SWAIN-GIT
    name: maxim
  draft: false
  prerelease: false
  footer: |
    ## What's New in v{{ .Version }}
    
    ###  New Features
    - **SQL Autocomplete**: Intelligent autocomplete for SQL keywords and commands
    - **Query Caching**: Learn from your queries to provide better suggestions
    - **Enhanced UI**: Symmetrical panels with improved visual design
    - **Better Connect Command**: Connect command now behaves like TUI version
    
    ###  Improvements
    - Fixed panel height and width asymmetry
    - Improved suggestion display in right panel
    - Enhanced keyboard navigation (Tab to cycle, Enter to select)
    - Better error handling and user experience
    
    ###  Bug Fixes
    - Fixed connect command exiting after connection
    - Fixed suggestion clearing after selection
    - Fixed panel resizing issues
    
    ---
    
    **Download**: [Latest Release](https://github.com/ASHUTOSH-SWAIN-GIT/maxim/releases/latest)
    
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
