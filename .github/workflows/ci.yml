name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify generated module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detection and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out
          ./scripts/check-coverage.sh coverage.out 15

  cross-platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Smoke-test CLI
        run: go test -tags=integration -count=1 .

      - name: Build Maxim
        run: go build -trimpath -o maxim-ci${{ runner.os == 'Windows' && '.exe' || '' }} .

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan Go dependencies and code
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: stable
          check-latest: true
          go-package: ./...

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maxim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maxim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAXIM_TEST_DB_HOST: localhost
      MAXIM_TEST_DB_PORT: "5432"
      MAXIM_TEST_DB_USER: postgres
      MAXIM_TEST_DB_PASSWORD: postgres
      MAXIM_TEST_DB_NAME: maxim_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Run PostgreSQL integration tests
        run: make test-integration-db

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Run Docker integration tests
        run: go test -tags=integration -count=1 -v ./internal/docker/...

  release-config:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
